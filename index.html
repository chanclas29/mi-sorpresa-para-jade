<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5e8ff"><title>Una carta para Jade 💜</title>
<style>
:root{--ink:#72547f;--pink:#f5c9df;--lav:#d9cafa;--purple:#a884c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;overflow-x:hidden;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% 15%,#fff 0 5%,transparent 28%),linear-gradient(135deg,#ffedf5,#f0e8ff 55%,#fff6fb)}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(55px);opacity:.35;background:#efaed0}.orb.a{top:-100px;left:-90px}.orb.b{right:-100px;bottom:-100px;background:#bca5ef}
.card{position:relative;z-index:1;width:min(100%,620px);padding:clamp(24px,6vw,46px);text-align:center;border:1px solid #fff;border-radius:30px;background:#ffffffc9;backdrop-filter:blur(12px);box-shadow:0 20px 65px #86639a25}
.pill{display:inline-block;border-radius:30px;padding:8px 15px;background:#f8e6f1;color:#986d9e;font-size:.82rem;letter-spacing:.04em}
h1{margin:17px 0 8px;font-size:clamp(2.3rem,8vw,3.8rem);color:#a177b0}.intro{line-height:1.7;color:#806c88}
button{border:0;border-radius:30px;padding:14px 22px;margin:10px 5px 0;background:linear-gradient(110deg,#eaa9c8,#b39be4);color:white;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px #b28bbd42;transition:.2s}
button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid #78518c;outline-offset:3px}
.envelope-area{margin:28px auto 5px;max-width:300px;cursor:pointer;user-select:none}
.envelope{position:relative;width:230px;height:150px;margin:auto;background:#eebbd3;border-radius:8px;box-shadow:0 12px 25px #a878a833;transition:transform .5s}
.envelope:before{content:"";position:absolute;inset:0;background:#f7d7e6;clip-path:polygon(0 0,50% 58%,100% 0);transform-origin:top;transition:transform .75s;z-index:3}
.envelope:after{content:"";position:absolute;inset:0;background:#e9aeca;clip-path:polygon(0 100%,50% 48%,100% 100%);z-index:2}
.seal{position:absolute;z-index:4;left:50%;top:54%;transform:translate(-50%,-50%);font-size:2rem;transition:.4s}
.letter{position:absolute;z-index:1;left:10px;right:10px;bottom:8px;height:125px;padding:15px 8px;background:#fffafd;border-radius:8px;display:grid;place-items:center;color:#a174aa;font-weight:700;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.envelope.open:before{transform:rotateX(180deg);z-index:0}.envelope.open .letter{transform:translateY(-95px);z-index:4}.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.hint{font-size:.9rem;color:#9b83a2;margin-top:13px}
.message-box{display:none;margin:30px auto 0;padding:25px 22px;background:#fffafd;border:1px solid #f2ddeb;border-radius:22px;box-shadow:0 10px 30px #9f76a21a;animation:rise .8s ease both}
.message-box.show{display:block}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.message-box h2{margin:0 0 12px;color:#a177b0}.typed{min-height:85px;line-height:1.9;font-size:1.12rem;white-space:pre-line}.sign{font-weight:bold;color:#a177b0;margin-top:16px}
.end{margin:20px 0 0;color:#9a83a0;font-size:.9rem}.music{font-size:.85rem;color:#987e9d;margin-top:14px}
.float{position:fixed;bottom:-35px;pointer-events:none;z-index:0;animation:float 7s linear forwards}@keyframes float{15%{opacity:.85}100%{transform:translateY(-115vh) rotate(35deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div></div>
<main class="card">
<span class="pill">HECHO CON MUCHO CARIÑO</span>
<h1>Mi niña Jade 💜</h1>
<p class="intro">Tengo algo pequeñito para ti…<br>Solo tienes que abrirlo. 🌷</p>
<div class="envelope-area" id="envelopeArea" role="button" tabindex="0" aria-label="Abrir carta">
 <div class="envelope" id="envelope"><div class="letter">Una cartita para ti 💌</div><div class="seal">💜</div></div>
 <div class="hint" id="hint">Toca el sobre para abrirlo</div>
</div>
<button id="openBtn">Abrir mi cartita 💌</button>
<section class="message-box" id="messageBox" aria-live="polite">
<h2>Para ti, Jade 🌸</h2>
<div class="typed" id="typed"></div>
<div class="sign">Con cariño, Adrian 💜</div>
<p class="end">Espero que esta pequeña sorpresa te saque una sonrisa. 🥰</p>
</section>
<p class="music">♫ Una canción para acompañar este momento</p>
<audio id="song" src="mi-cancion.mp3" preload="none" loop></audio>
</main>
<script>
const area=document.getElementById('envelopeArea'),env=document.getElementById('envelope'),btn=document.getElementById('openBtn'),box=document.getElementById('messageBox'),typed=document.getElementById('typed'),song=document.getElementById('song');
const message='Quiero que sepas lo especial que eres para mí. ❤️';let opened=false;
function hearts(){const e=document.createElement('span');e.className='float';e.textContent=['💜','💗','💕','✨','🌸'][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+'vw';e.style.fontSize=(16+Math.random()*18)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),7500)}
async function openLetter(){if(opened)return;opened=true;env.classList.add('open');document.getElementById('hint').textContent='Una carta hecha especialmente para ti 💜';btn.textContent='¡La carta es tuya! 💗';btn.disabled=true;box.classList.add('show');let i=0;const t=setInterval(()=>{typed.textContent=message.slice(0,++i);if(i>=message.length)clearInterval(t)},65);for(let n=0;n<22;n++)setTimeout(hearts,n*130);song.volume=.55;try{await song.play()}catch(e){document.querySelector('.music').textContent='♫ Si no escuchas la canción, comprueba que el archivo mi-cancion.mp3 esté junto a esta página.'}}
area.addEventListener('click',openLetter);area.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter()}});btn.addEventListener('click',openLetter);setInterval(()=>{if(opened)hearts()},1100);
</script></body></html>
